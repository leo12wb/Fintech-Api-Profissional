<div class="nexbank-container">
  <h1 class="page-title">Depósito Simulado</h1>
  <div class="disclaimer-banner">⚠️ Depósito simulado — nenhum dinheiro real é movimentado.</div>
  <mat-card class="nexbank-card" style="max-width: 520px;">
    <mat-card-content>
      <app-error-message [message]="error"></app-error-message>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Conta de Destino</mat-label>
          <mat-select formControlName="accountId">
            @for (acc of accounts; track acc.id) {
              <mat-option [value]="acc.id">{{ acc.accountNumber }} — {{ acc.currency }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Valor</mat-label>
          <input matInput type="number" formControlName="amount" min="0.01" step="0.01">
          <mat-icon matSuffix>attach_money</mat-icon>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Moeda</mat-label>
          <mat-select formControlName="currency">
            <mat-option value="BRL">BRL</mat-option>
            <mat-option value="USD">USD</mat-option>
          </mat-select>
        </mat-form-field>
        <div class="actions">
          <button mat-button type="button" routerLink="/dashboard">Cancelar</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || loading">
            {{ loading ? 'Depositando...' : 'Confirmar Depósito' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
